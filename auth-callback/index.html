<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completing sign-in…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafafa; }
    .card { text-align: center; padding: 2rem; border: 1px solid #e4e4e7; border-radius: 1rem; background: #fff; max-width: 360px; width: 100%; }
    .spinner { display: inline-block; width: 48px; height: 48px; border: 4px solid rgba(24,24,27,0.15); border-top-color: #18181b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; color: #18181b; }
    p { font-size: 0.875rem; color: #71717a; margin: 0; }
    .error-text { color: #dc2626; margin-top: 1rem; font-size: 0.875rem; }
    a { color: #18181b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="heading">Completing your sign-in…</h1>
    <p id="status">Finishing authentication with Google.</p>
  </div>

  <script>
    // No CDN imports — all Amplify sub-path imports share different singletons on esm.sh,
    // causing "not configured" errors. This page implements OAuth 2.0 + PKCE directly
    // using standard Web APIs (fetch, crypto.subtle, localStorage).

    const COGNITO_CLIENT_ID = '1enoejqc07arf31an928fgo0nf'
    const COGNITO_DOMAIN    = 'us-west-2uyxuwf8nj.auth.us-west-2.amazoncognito.com'
    const REDIRECT_URI      = 'https://auth.realtybase.ca/oauth/callback'
    const BACKEND_URL       = 'https://realstate-be.onrender.com'

    function showError(message) {
      document.getElementById('spinner').style.display = 'none'
      const status = document.getElementById('status')
      status.textContent = ''
      // textContent prevents HTML injection of server-supplied strings (CR-03)
      const err = document.createElement('span')
      err.className = 'error-text'
      err.textContent = message
      const link = document.createElement('a')
      link.href = '/'
      link.style.cssText = 'margin-top:0.75rem;display:inline-block'
      link.textContent = 'Back to sign in'
      status.appendChild(err)
      status.appendChild(document.createElement('br'))
      status.appendChild(link)
    }

    function isSafeReturnTo(value) {
      // Only same-origin relative paths are allowed — rejects absolute URLs and
      // protocol-relative "//evil.com" paths that would escape the tenant's domain.
      return typeof value === 'string' && value.startsWith('/') && !value.startsWith('//')
    }

    async function isValidBrokerageDomain(domain) {
      // Validates against the backend's routable BrokerageDomain records (active or
      // phasing_out) instead of a hardcoded *.realtybase.ca suffix, so brokerages on
      // fully custom domains can use Google sign-in too.
      if (typeof domain !== 'string' || !domain) return false
      try {
        const res = await fetch(BACKEND_URL + '/v1/domains/lookup?domain=' + encodeURIComponent(domain))
        return res.ok
      } catch (err) {
        console.error('[auth-cb] domain validation request failed:', err)
        return false
      }
    }

    function b64url(bytes) {
      return btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '')
    }

    async function generatePKCE() {
      const verifierBytes = new Uint8Array(32)
      crypto.getRandomValues(verifierBytes)
      const verifier  = b64url(verifierBytes)
      const hash      = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))
      const challenge = b64url(new Uint8Array(hash))
      return { verifier, challenge }
    }

    function generateState() {
      const bytes = new Uint8Array(16)
      crypto.getRandomValues(bytes)
      return b64url(bytes)
    }

    const params    = new URLSearchParams(location.search)
    const code      = params.get('code')
    const urlState  = params.get('state')
    const brokerage = params.get('brokerage')
    const returnTo  = params.get('returnTo')

    if (!code && brokerage) {
      // ── Initiation phase ──────────────────────────────────────────────────
      // Frontend navigates here so PKCE is generated on auth.realtybase.ca —
      // the same origin as /oauth/callback — ensuring localStorage is shared.
      document.getElementById('heading').textContent = 'Redirecting to Google…'
      document.getElementById('status').textContent  = 'You will be redirected to sign in with Google.'

      ;(async () => {
        // Security: validate brokerage domain against the backend before storing (T-04-03-01)
        if (!(await isValidBrokerageDomain(brokerage))) {
          showError('Invalid sign-in request. Please return to your brokerage portal.')
          return
        }

        const { verifier, challenge } = await generatePKCE()
        const state = generateState()

        localStorage.setItem('auth_pkce_verifier',  verifier)
        localStorage.setItem('auth_pkce_state',     state)
        localStorage.setItem('auth_pkce_brokerage', brokerage)
        if (returnTo && isSafeReturnTo(returnTo)) {
          localStorage.setItem('auth_pkce_return_to', returnTo)
        }

        const qs = new URLSearchParams({
          response_type:         'code',
          client_id:             COGNITO_CLIENT_ID,
          redirect_uri:          REDIRECT_URI,
          scope:                 'email openid aws.cognito.signin.user.admin',
          identity_provider:     'Google',
          code_challenge:        challenge,
          code_challenge_method: 'S256',
          state,
        })
        window.location.href = `https://${COGNITO_DOMAIN}/oauth2/authorize?${qs}`
      })()

    } else if (code && urlState) {
      // ── Callback phase ────────────────────────────────────────────────────
      ;(async () => {
        try {
          const verifier    = localStorage.getItem('auth_pkce_verifier')
          const storedState = localStorage.getItem('auth_pkce_state')
          const broker      = localStorage.getItem('auth_pkce_brokerage')
          const savedReturn = localStorage.getItem('auth_pkce_return_to')


          if (!verifier || !storedState) {
            showError('Sign-in session expired. Please return to your portal and try again.')
            return
          }
          if (urlState !== storedState) {
            console.error('[auth-cb] state mismatch')
            showError('Invalid sign-in state. Please try again.')
            return
          }

          // Remove before exchange to prevent replay on page reload
          localStorage.removeItem('auth_pkce_verifier')
          localStorage.removeItem('auth_pkce_state')
          localStorage.removeItem('auth_pkce_brokerage')
          localStorage.removeItem('auth_pkce_return_to')

          // Exchange authorization code for tokens at the Cognito token endpoint
          const tokenRes = await fetch(`https://${COGNITO_DOMAIN}/oauth2/token`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type:    'authorization_code',
              client_id:     COGNITO_CLIENT_ID,
              code,
              redirect_uri:  REDIRECT_URI,
              code_verifier: verifier,
            }),
          })

          console.log('[auth-cb] Cognito token status:', tokenRes.status)
          if (!tokenRes.ok) {
            const e = await tokenRes.json().catch(() => ({}))
            console.error('[auth-cb] token exchange failed:', e)
            showError('Authentication failed. Please try again.')
            return
          }

          const { id_token } = await tokenRes.json()
          if (!id_token) {
            showError('Authentication failed: no id_token in response. Please try again.')
            return
          }

          // Security: validate brokerage domain against the backend before redirecting (T-04-03-01)
          if (!broker || !(await isValidBrokerageDomain(broker))) {
            console.error('[auth-cb] brokerage validation failed:', broker)
            showError('Invalid sign-in state. Please return to your brokerage portal.')
            return
          }

          // Hand off the raw Cognito id_token instead of exchanging it for an app
          // session here. The final POST /v1/sessions must happen from the
          // brokerage's own origin (broker), not this shared auth.realtybase.ca
          // page — otherwise the resulting session cookie gets partitioned under
          // the wrong top-level site and is invisible once the browser lands on
          // the brokerage's domain. login-success on the brokerage's own origin
          // performs that exchange itself.
          // Token handoff via URL hash — hash is browser-only, not logged server-side (D-04)
          const hash = savedReturn && isSafeReturnTo(savedReturn)
            ? `id_token=${id_token}&returnTo=${encodeURIComponent(savedReturn)}`
            : `id_token=${id_token}`
          window.location.href = 'https://' + broker + '/auth/login-success#' + hash
        } catch (err) {
          showError('Something went wrong completing your sign-in. Please try again.')
          console.error('[auth-cb] error:', err)
        }
      })()

    } else {
      document.getElementById('spinner').style.display = 'none'
      document.getElementById('heading').textContent   = 'Nothing to do here'
      document.getElementById('status').textContent    = 'Please use your brokerage portal to sign in.'
    }
  </script>
</body>
</html>
