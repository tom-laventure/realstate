<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completing sign-in…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafafa; }
    .card { text-align: center; padding: 2rem; border: 1px solid #e4e4e7; border-radius: 1rem; background: #fff; max-width: 360px; width: 100%; }
    .spinner { display: inline-block; width: 48px; height: 48px; border: 4px solid rgba(24,24,27,0.15); border-top-color: #18181b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; color: #18181b; }
    p { font-size: 0.875rem; color: #71717a; margin: 0; }
    .error-text { color: #dc2626; margin-top: 1rem; font-size: 0.875rem; }
    a { color: #18181b; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1>Completing your sign-in…</h1>
    <p id="status">Finishing authentication with Google.</p>
  </div>

  <script type="module">
    // Amplify config values embedded from frontend/.env at development time.
    // These must be updated when deploying to a different environment.
    const COGNITO_USER_POOL_ID = 'us-west-2_uYxUwf8nj'
    const COGNITO_CLIENT_ID = '1enoejqc07arf31an928fgo0nf'
    const COGNITO_DOMAIN = 'us-west-2uyxuwf8nj.auth.us-west-2.amazoncognito.com'
    const BACKEND_URL = 'https://realstate-be.onrender.com'

    import { Amplify } from 'https://esm.sh/aws-amplify@6.15.9'
    import { fetchAuthSession } from 'https://esm.sh/aws-amplify@6.15.9/auth'

    function showError(message) {
      document.getElementById('spinner').style.display = 'none'
      const status = document.getElementById('status')
      status.textContent = ''

      // textContent prevents HTML interpretation of server-supplied content (CR-03 fix)
      const errorSpan = document.createElement('span')
      errorSpan.className = 'error-text'
      errorSpan.textContent = message

      const br = document.createElement('br')

      const backLink = document.createElement('a')
      backLink.href = '/'
      backLink.style.cssText = 'margin-top:0.75rem;display:inline-block'
      backLink.textContent = 'Back to sign in'

      status.appendChild(errorSpan)
      status.appendChild(br)
      status.appendChild(backLink)
    }

    Amplify.configure({
      Auth: {
        Cognito: {
          userPoolId: COGNITO_USER_POOL_ID,
          userPoolClientId: COGNITO_CLIENT_ID,
          loginWith: {
            oauth: {
              domain: COGNITO_DOMAIN,
              scopes: ['email', 'openid', 'aws.cognito.signin.user.admin'],
              redirectSignIn: ['https://auth.realtybase.ca/oauth/callback'],
              redirectSignOut: ['https://auth.realtybase.ca/oauth/callback'],
              responseType: 'code'
            }
          }
        }
      }
    })

    // Poll fetchAuthSession() until Amplify's background PKCE code exchange completes.
    // configure() starts the exchange asynchronously; fetchAuthSession() initially returns {}
    // and only gains tokens once the exchange finishes (typically within 1-2 seconds).
    async function waitForAuthSession(timeoutMs = 15000) {
      const deadline = Date.now() + timeoutMs
      let attempt = 0
      while (Date.now() < deadline) {
        const session = await fetchAuthSession()
        attempt++
        console.log(`[auth-cb] poll #${attempt}`, {
          hasIdToken: !!session.tokens?.idToken,
          elapsed: Date.now() - (deadline - timeoutMs),
        })
        if (session.tokens?.idToken) return session
        await new Promise(r => setTimeout(r, 300))
      }
      throw new Error('Sign-in timed out waiting for Amplify code exchange')
    }

    ;(async () => {
      try {
        console.log('[auth-cb] page loaded', {
          href: location.href,
          code: new URLSearchParams(location.search).get('code'),
          state: new URLSearchParams(location.search).get('state'),
        })

        console.log('[auth-cb] waiting for Amplify code exchange…')
        let session
        try {
          session = await waitForAuthSession()
        } catch (sessionErr) {
          console.error('[auth-cb] waitForAuthSession() threw:', sessionErr)
          throw sessionErr
        }

        const idToken = session.tokens?.idToken?.toString()
        console.log('[auth-cb] idToken obtained, length:', idToken.length)

        // Extract the brokerage customState from the URL's state param directly.
        // Amplify v6 format: <alphanumeric pkce state>-<hex-encoded customState>
        // The pkce state charset is [A-Za-z0-9] (no '-'), so the first '-' is the separator.
        // customState was set by the frontend as: btoa(JSON.stringify({ brokerage: "..." }))
        const stateParam = new URLSearchParams(location.search).get('state') || ''
        const sep = stateParam.indexOf('-')
        let customState = null
        if (sep !== -1) {
          try {
            const hex = stateParam.slice(sep + 1)
            customState = hex.replace(/../g, h => String.fromCharCode(parseInt(h, 16)))
            console.log('[auth-cb] customState extracted from URL:', customState)
          } catch (hexErr) {
            console.warn('[auth-cb] hex decode of customState failed:', hexErr)
          }
        } else {
          console.warn('[auth-cb] no "-" separator found in state param:', stateParam)
        }

        // Parse brokerage domain from customState
        // Format: base64(JSON.stringify({ brokerage: "broker1.realtybase.ca" }))
        let brokerage = null
        if (customState) {
          try {
            const decoded = JSON.parse(atob(customState))
            brokerage = decoded.brokerage
            console.log('[auth-cb] brokerage parsed:', brokerage)
          } catch (parseErr) {
            console.warn('[auth-cb] customState JSON parse failed:', parseErr, 'raw:', customState)
          }
        }

        // Security: validate brokerage domain before redirecting (open redirector prevention — T-04-03-01)
        // Only allow redirect to .realtybase.ca subdomains or root domain
        if (!brokerage || (brokerage !== 'realtybase.ca' && !brokerage.endsWith('.realtybase.ca'))) {
          console.error('[auth-cb] brokerage validation failed:', brokerage)
          showError('Invalid sign-in state. Please return to your brokerage portal and sign in again.')
          return
        }

        console.log('[auth-cb] posting to backend /v1/sessions…')
        // Exchange Cognito idToken for app JWT via backend session endpoint
        const response = await fetch(BACKEND_URL + '/v1/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken })
        })

        console.log('[auth-cb] backend responded:', response.status, response.statusText)
        if (!response.ok) {
          const body = await response.json().catch(() => ({}))
          console.error('[auth-cb] backend error body:', body)
          showError('Sign-in failed: ' + (body.error || response.statusText) + '. Please try again.')
          return
        }

        const { token } = await response.json()
        console.log('[auth-cb] app token received, redirecting to brokerage…')

        // Token handoff: redirect to brokerage domain with JWT in URL hash (per D-04).
        // Hash is browser-only — not sent in Referer headers, not in server access logs.
        window.location.href = 'https://' + brokerage + '/auth/login-success#token=' + token
      } catch (err) {
        showError('Something went wrong completing your sign-in. Please try again.')
        console.error('OAuth callback error:', err)
      }
    })()
  </script>
</body>
</html>
